<!DOCTYPE html>
<html>
<head>
    <title>XAUUSD Bot</title>

    <script src="https://s3.tradingview.com/tv.js"></script>

    <style>

        body{
            margin:0;
            padding:0;
            background:#050816;
            font-family:Arial;
            color:white;
        }

        h1{
            text-align:center;
            padding:20px;
            font-size:48px;
        }

        .main{
            display:flex;
            gap:20px;
            padding:20px;
            flex-wrap:wrap;
            justify-content:center;
        }

        .chart-box{
            width:70%;
            min-width:700px;
            background:#0d1328;
            border-radius:20px;
            padding:15px;
            box-shadow:0 0 20px rgba(0,255,255,0.2);
        }

        .side-box{
            width:320px;
            background:#0d1328;
            border-radius:20px;
            padding:20px;
            box-shadow:0 0 20px rgba(0,255,255,0.2);
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            margin-top:10px;
            margin-bottom:15px;
            font-size:18px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#00d9ff;
            color:white;
            font-size:22px;
            font-weight:bold;
            cursor:pointer;
        }

        .result{
            margin-top:25px;
            background:#111a35;
            padding:25px;
            border-radius:20px;
            text-align:center;
            font-size:22px;
            line-height:1.8;
        }

        .buy{
            color:#00ff66;
            font-size:60px;
            font-weight:bold;
        }

        .sell{
            color:#ff4d4d;
            font-size:60px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<h1>XAUUSD AI SIGNALS</h1>

<div class="main">

    <div class="chart-box">

        <div id="tradingview_chart"></div>

    </div>

    <div class="side-box">

        <h2>⚙️ Trade Setup</h2>

        <label>💰 Balance (USD $)</label>

        <input type="number" id="balance" value="100">

        <button onclick="analyzeTrade()">🔥 Analyze Trade</button>

        <div class="result" id="result">

            Waiting For Analysis...

        </div>

    </div>

</div>

<script>

new TradingView.widget({

    "width":"100%",
    "height":650,
    "symbol":"OANDA:XAUUSD",
    "interval":"5",
    "timezone":"Asia/Kolkata",
    "theme":"dark",
    "style":"1",
    "locale":"en",
    "toolbar_bg":"#0d1328",
    "enable_publishing":false,
    "allow_symbol_change":false,
    "container_id":"tradingview_chart"

});

async function analyzeTrade(){

    const balance =
        document.getElementById("balance").value;

    const result =
        document.getElementById("result");

    result.innerHTML = "Analyzing Trade...";

    try{

        const response = await fetch(
            `https://ai-trading-bot-production-064d.up.railway.app/signal?balance=${balance}`
        );

        const data = await response.json();

        const signalClass =
            data.signal === "BUY"
            ? "buy"
            : "sell";

        result.innerHTML = `

            <div class="${signalClass}">
                ${data.signal}
            </div>

            <br>

            Entry: ${data.entry}

            <br>

            Stop Loss: ${data.sl}

            <br>

            Take Profit: ${data.tp}

            <br><br>

            Lot Size: ${data.lot} Lots

            <br>

            Profit: $${data.profit}

            <br>

            Loss: $${data.loss}

            <br>

            Confidence: ${data.confidence}

        `;

    }

    catch(error){

        console.log(error);

        result.innerHTML =
            "Backend Connect Error";

    }

}
</script>

</body>
</html>
