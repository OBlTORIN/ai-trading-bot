<!DOCTYPE html>
<html>

<head>

    <title>XAUUSD AI SIGNALS</title>

    <style>

        body{
            margin:0;
            padding:0;
            background:#050816;
            color:white;
            font-family:Arial;
        }

        h1{
            text-align:center;
            font-size:50px;
            padding:20px;
        }

        .main{
            display:flex;
            gap:20px;
            padding:20px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .chart-box{
            width:70%;
            min-width:700px;
            background:#0d1328;
            padding:15px;
            border-radius:20px;
        }

        .side-box{
            width:350px;
            background:#0d1328;
            padding:20px;
            border-radius:20px;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            margin-top:10px;
            margin-bottom:15px;
            font-size:20px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#00d9ff;
            color:white;
            font-size:22px;
            font-weight:bold;
            cursor:pointer;
        }

        .result{
            margin-top:20px;
            background:#111a35;
            border-radius:20px;
            padding:25px;
            text-align:center;
            line-height:1.8;
            font-size:22px;
        }

        .buy{
            color:#00ff66;
            font-size:60px;
            font-weight:bold;
        }

        .sell{
            color:#ff4d4d;
            font-size:60px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<h1>XAUUSD AI SIGNALS</h1>

<div class="main">

    <div class="chart-box">

        <iframe
            src="https://s.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=5&theme=dark&style=1&timezone=Asia/Kolkata"
            width="100%"
            height="650"
            frameborder="0"
            scrolling="no">
        </iframe>

    </div>

    <div class="side-box">

        <h2>⚙️ Trade Setup</h2>

        <label>💰 Balance (USD $)</label>

        <input type="number" id="balance" value="100">

        <button onclick="analyzeTrade()">
            🔥 Analyze Trade
        </button>

        <div class="result" id="result">

            Waiting For Analysis...

        </div>

    </div>

</div>

<script>

async function analyzeTrade(){

    const balance =
        document.getElementById("balance").value;

    const result =
        document.getElementById("result");

    result.innerHTML = "Analyzing Market...";

    try{

        const response = await fetch(
            `https://ai-trading-bot-production-064d.up.railway.app/signal?balance=${balance}`
        );

        const data = await response.json();

        let signalClass = "buy";

        if(data.signal === "SELL"){
            signalClass = "sell";
        }

        result.innerHTML = `

            <div class="${signalClass}">
                ${data.signal}
            </div>

            <br>

            Entry: ${data.entry}

            <br>

            Stop Loss: ${data.sl}

            <br>

            Take Profit: ${data.tp}

            <br><br>

            Lot Size: ${data.lot} Lots

            <br>

            Profit: $${data.profit}

            <br>

            Loss: $${data.loss}

            <br>

            Confidence: ${data.confidence}

        `;

    }

    catch(error){

        result.innerHTML = "Backend Connect Error";

    }

}

setInterval(() => {

    analyzeTrade();

}, 15000);

</script>

</body>

</html>
