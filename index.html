<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD BOT</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.container{
    padding:20px;
}

.title{
    text-align:center;
    font-size:45px;
    font-weight:bold;
    margin-bottom:20px;
}

.main{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.chart-box{
    flex:3;
    min-width:700px;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    padding:10px;
}

.side-box{
    flex:1;
    min-width:280px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    margin-bottom:15px;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#06b6d4;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#0891b2;
}

.signal{
    font-size:35px;
    font-weight:bold;
}

.buy{
    color:#22c55e;
}

.sell{
    color:#ef4444;
}

.result p{
    font-size:20px;
}

#loading{
    display:none;
    text-align:center;
    margin-top:20px;
    font-size:22px;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        XAUUSD BOT
    </div>

    <div class="main">

        <div class="chart-box">

            <div id="tradingview_chart"></div>

        </div>

        <div class="side-box">

            <div class="card">

                <h2>Trade Setup</h2>

                <label>Balance (USD $)</label>

                <input type="number" id="balance" placeholder="Enter Balance">

                <button onclick="getSignal()">
                    Analyze Trade
                </button>

                <div id="loading">
                    Analyzing Chart...
                </div>

            </div>

            <div class="card result">

                <p>
                    Signal:
                    <span id="signal" class="signal">---</span>
                </p>

                <p>
                    Entry:
                    <span id="entry">---</span>
                </p>

                <p>
                    Stop Loss:
                    <span id="sl">---</span>
                </p>

                <p>
                    Take Profit:
                    <span id="tp">---</span>
                </p>

                <p>
                    Confidence:
                    <span id="confidence">---</span>
                </p>

            </div>

        </div>

    </div>

</div>

<script>

new TradingView.widget({
    "width":"100%",
    "height":700,
    "symbol":"OANDA:XAUUSD",
    "interval":"1",
    "timezone":"Asia/Kolkata",
    "theme":"dark",
    "style":"1",
    "locale":"en",
    "toolbar_bg":"#111827",
    "enable_publishing":false,
    "hide_side_toolbar":false,
    "allow_symbol_change":true,
    "container_id":"tradingview_chart"
});

async function getSignal(){

    const balance = document.getElementById("balance").value;

    if(balance === ""){
        alert("Enter balance first");
        return;
    }

    document.getElementById("loading").style.display = "block";

    try{

        const response = await fetch(
            "https://ai-trading-bot-production-064d.up.railway.app/signal"
        );

        const data = await response.json();

        document.getElementById("loading").style.display = "none";

        document.getElementById("signal").innerText = data.signal;
        document.getElementById("entry").innerText = data.entry;
        document.getElementById("sl").innerText = data.sl;
        document.getElementById("tp").innerText = data.tp;
        document.getElementById("confidence").innerText = data.confidence;

        if(data.signal === "BUY"){
            document.getElementById("signal").className = "signal buy";
        }
        else{
            document.getElementById("signal").className = "signal sell";
        }

    }
    catch(error){

        document.getElementById("loading").style.display = "none";

        alert("Backend connect nahi ho raha");

        console.log(error);
    }

}

</script>

</body>
</html>
