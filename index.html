<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Bot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    margin-bottom:20px;
}

.main{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.left{
    flex:2;
    min-width:300px;
}

.right{
    flex:1;
    min-width:300px;
}

.chart-box{
    width:100%;
    border-radius:20px;
    overflow:hidden;
    background:#111827;
    padding:10px;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#06b6d4;
    color:white;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0891b2;
}

.signal-box{
    text-align:center;
}

.signal{
    font-size:48px;
    font-weight:bold;
    margin-bottom:10px;
}

.buy{
    color:#22c55e;
}

.sell{
    color:#ef4444;
}

.info{
    font-size:20px;
    margin:10px 0;
}

.confidence{
    margin-top:15px;
    font-size:22px;
    color:#facc15;
}

.loading{
    display:none;
    text-align:center;
    margin-top:20px;
    font-size:20px;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
           XAUUSD AI SIGNALS
    </div>

    <div class="main">

        <!-- LEFT SIDE -->
        <div class="left">

            <!-- LIVE CHART -->
            <div class="chart-box">

                <div class="tradingview-widget-container">
                    <div id="tradingview_chart"></div>

                    <script type="text/javascript"
                    src="https://s3.tradingview.com/tv.js"></script>

                    <script type="text/javascript">
                    new TradingView.widget({
                        "width": "100%",
                        "height": 550,
                        "symbol": "OANDA:XAUUSD",
                        "interval": "1",
                        "timezone": "Asia/Kolkata",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "toolbar_bg": "#0f172a",
                        "enable_publishing": false,
                        "hide_top_toolbar": false,
                        "hide_legend": false,
                        "save_image": false,
                        "container_id": "tradingview_chart"
                    });
                    </script>

                </div>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right">

            <!-- INPUT CARD -->
            <div class="card">

                <h2>⚙ Trade Setup</h2>

                <label>💰 Balance (USD $)</label>
                <input type="number" id="balance" placeholder="Enter Balance">

                <button onclick="getSignal()">
                    Analyze Trade
                </button>

                <div class="loading" id="loading">
                    ⏳ Analyzing Market...
                </div>

            </div>

            <!-- SIGNAL CARD -->
            <div class="card signal-box">

                <div id="signal" class="signal">
                    ---
                </div>

                <div class="info">
                    Entry: <span id="entry">---</span>
                </div>

                <div class="info">
                    SL: <span id="sl">---</span>
                </div>

                <div class="info">
                    TP: <span id="tp">---</span>
                </div>

                <div class="confidence">
                    Confidence: <span id="confidence">---</span>
                </div>

            </div>

        </div>

    </div>

</div>

<script>

async function getSignal(){

    const balance = document.getElementById("balance").value;

    if(balance === ""){
        alert("Enter balance first");
        return;
    }

    document.getElementById("loading").style.display = "block";

    try{

        const response = await fetch("https://YOUR-RAILWAY-URL.up.railway.app/signal");

        const data = await response.json();

        document.getElementById("loading").style.display = "none";

        document.getElementById("signal").innerText = data.signal;
        document.getElementById("entry").innerText = data.entry;
        document.getElementById("sl").innerText = data.sl;
        document.getElementById("tp").innerText = data.tp;
        document.getElementById("confidence").innerText = data.confidence;

        if(data.signal === "BUY"){
            document.getElementById("signal").className = "signal buy";
        }
        else{
            document.getElementById("signal").className = "signal sell";
        }

    }
    catch(error){

        document.getElementById("loading").style.display = "none";

        alert("Backend connect nahi ho raha");

        console.log(error);
    }

}

</script>

</body>
</html>
