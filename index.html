<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XAUUSD BOT</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.container{
    padding:20px;
}

.title{
    text-align:center;
    font-size:45px;
    font-weight:bold;
    margin-bottom:20px;
}

.main{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.chart-box{
    flex:3;
    min-width:700px;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    padding:10px;
}

.side-box{
    flex:1;
    min-width:320px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    margin-bottom:15px;
    font-size:18px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#06b6d4;
    color:white;
    font-size:20px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0891b2;
}

.signal{
    font-size:55px;
    font-weight:bold;
}

.buy{
    color:#22c55e;
}

.sell{
    color:#ef4444;
}

.result{
    text-align:center;
}

.result p{
    font-size:24px;
    margin:14px 0;
}

hr{
    border:1px solid #374151;
    margin:20px 0;
}

#loading{
    display:none;
    text-align:center;
    margin-top:20px;
    font-size:20px;
    color:#06b6d4;
}

</style>

</head>

<body>

<div class="container">

    <div class="title">
        XAUUSD AI SIGNALS
    </div>

    <div class="main">

        <div class="chart-box">

            <div id="tradingview_chart"></div>

        </div>

        <div class="side-box">

            <div class="card">

                <h2>⚙️ Trade Setup</h2>

                <label>💰 Balance (USD $)</label>

                <input
                    type="number"
                    id="balance"
                    placeholder="Enter Balance"
                >

                <button onclick="getSignal()">
                    🔥 Analyze Trade
                </button>

                <div id="loading">
                    Analyzing Chart...
                </div>

            </div>

            <div class="card result">

                <p style="text-align:center;">
                    <span id="signal" class="signal">---</span>
                </p>

                <p>
                    Entry:
                    <span id="entry">---</span>
                </p>

                <p>
                    Stop Loss:
                    <span id="sl">---</span>
                </p>

                <p>
                    Take Profit:
                    <span id="tp">---</span>
                </p>

                <hr>

                <p>
                    Lot Size:
                    <span id="lot">---</span>
                </p>

                <p>
                    Profit:
                    <span id="profit">---</span>
                </p>

                <p>
                    Loss:
                    <span id="loss">---</span>
                </p>

                <p>
                    Confidence:
                    <span id="confidence">---</span>
                </p>

            </div>

        </div>

    </div>

</div>

<script>

new TradingView.widget({

    "width":"100%",
    "height":700,
    "symbol":"OANDA:XAUUSD",
    "interval":"1",
    "timezone":"Asia/Kolkata",
    "theme":"dark",
    "style":"1",
    "locale":"en",
    "toolbar_bg":"#111827",
    "enable_publishing":false,
    "hide_side_toolbar":false,
    "allow_symbol_change":false,
    "container_id":"tradingview_chart"

});

async function getSignal(){

    const balance =
        document.getElementById("balance").value;

    if(balance === ""){

        alert("Enter balance first");
        return;
    }

    document.getElementById("loading").style.display =
        "block";

    try{

        const response = await fetch(
            "https://ai-trading-bot-production-064d.up.railway.app/signal"
        );

        const data = await response.json();

        document.getElementById("loading").style.display =
            "none";

        // SIGNAL DATA

        document.getElementById("signal").innerText =
            data.signal;

        document.getElementById("entry").innerText =
            data.entry;

        document.getElementById("sl").innerText =
            data.sl;

        document.getElementById("tp").innerText =
            data.tp;

        document.getElementById("confidence").innerText =
            data.confidence;

        // COLOR

        if(data.signal === "BUY"){

            document.getElementById("signal").className =
                "signal buy";

        }else{

            document.getElementById("signal").className =
                "signal sell";
        }

        // LOT SIZE

        const balanceValue =
            parseFloat(balance);

        const entry =
            parseFloat(data.entry);

        const sl =
            parseFloat(data.sl);

        const tp =
            parseFloat(data.tp);

        const riskPercent = 2;

        const riskAmount =
            (balanceValue * riskPercent) / 100;

        const slDistance =
            Math.abs(entry - sl);

        let lotSize =
            (riskAmount / slDistance) / 10;

        if(lotSize < 0.01){

            lotSize = 0.01;
        }

        lotSize = lotSize.toFixed(2);

        // PROFIT LOSS

        const profitUSD = (

            Math.abs(tp - entry)
            * lotSize
            * 10

        ).toFixed(2);

        const lossUSD = (

            Math.abs(entry - sl)
            * lotSize
            * 10

        ).toFixed(2);

        // UI UPDATE

        document.getElementById("lot").innerText =
            lotSize + " Lots";

        document.getElementById("profit").innerText =
            "$" + profitUSD;

        document.getElementById("loss").innerText =
            "$" + lossUSD;

    }

    catch(error){

        document.getElementById("loading").style.display =
            "none";

        alert("Backend connect nahi ho raha");

        console.log(error);
    }

}

</script>

</body>
</html>
