<!DOCTYPE html>
<html>

<head>

    <title>XAUUSD AI SIGNALS</title>

    <script src="https://s3.tradingview.com/tv.js"></script>

    <style>

        body{
            margin:0;
            padding:0;
            background:#050816;
            color:white;
            font-family:Arial;
        }

        h1{
            text-align:center;
            font-size:50px;
            padding:20px;
        }

        .main{
            display:flex;
            gap:20px;
            padding:20px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .chart-box{
            width:70%;
            min-width:700px;
            background:#0d1328;
            padding:15px;
            border-radius:20px;
        }

        .side-box{
            width:350px;
            background:#0d1328;
            padding:20px;
            border-radius:20px;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            margin-top:10px;
            margin-bottom:15px;
            font-size:20px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#00d9ff;
            color:white;
            font-size:22px;
            font-weight:bold;
            cursor:pointer;
        }

        .result{
            margin-top:20px;
            background:#111a35;
            border-radius:20px;
            padding:25px;
            text-align:center;
            line-height:1.8;
            font-size:22px;
        }

        .buy{
            color:#00ff66;
            font-size:60px;
            font-weight:bold;
        }

        .sell{
            color:#ff4d4d;
            font-size:60px;
            font-weight:bold;
        }

        .extra-info{
            margin-top:20px;
            border-top:1px solid #2d3a63;
            padding-top:15px;
            font-size:18px;
            line-height:1.6;
            text-align:left;
        }

    </style>

</head>

<body>

<h1>XAUUSD AI SIGNALS</h1>

<div class="main">

    <div class="chart-box">

        <div id="tradingview_chart"></div>

    </div>

    <div class="side-box">

        <h2>⚙️ Trade Setup</h2>

        <label>💰 Balance (USD $)</label>

        <input type="number" id="balance" value="100">

        <button onclick="analyzeTrade()">
            🔥 Analyze Trade
        </button>

        <div class="result" id="result">

            Waiting For Analysis...

        </div>

    </div>

</div>

<script>

new TradingView.widget({

    "width":"100%",
    "height":650,
    "symbol":"OANDA:XAUUSD",
    "interval":"5",
    "timezone":"Asia/Kolkata",
    "theme":"dark",
    "style":"1",
    "locale":"en",
    "toolbar_bg":"#0d1328",
    "enable_publishing":false,
    "allow_symbol_change":false,
    "container_id":"tradingview_chart"

});

async function analyzeTrade(){

    const balance =
        document.getElementById("balance").value;

    const result =
        document.getElementById("result");

    result.innerHTML = "Analyzing Market...";

    try{

        const response = await fetch(
            `https://ai-trading-bot-production-064d.up.railway.app/signal?balance=${balance}`
        );

        const data = await response.json();

        let signalClass = "buy";

        if(data.signal === "SELL"){
            signalClass = "sell";
        }

        result.innerHTML = `

            <div class="${signalClass}">
                ${data.signal}
            </div>

            <br>

            Entry: ${data.entry}

            <br>

            Stop Loss: ${data.sl}

            <br>

            Take Profit: ${data.tp}

            <br><br>

            Lot Size: ${data.lot} Lots

            <br>

            Profit: $${data.profit}

            <br>

            Loss: $${data.loss}

            <br>

            Confidence: ${data.confidence}

            <div class="extra-info">

                <p>EMA 20: ${data.ema20}</p>

                <p>EMA 50: ${data.ema50}</p>

                <p>RSI: ${data.rsi}</p>

                <p>Volume Strength: ${data.volume}%</p>

                <p>Support: ${data.support}</p>

                <p>Resistance: ${data.resistance}</p>

            </div>

        `;

    }

    catch(error){

        result.innerHTML = "Backend Connect Error";

    }

}

// AUTO REFRESH

setInterval(() => {

    analyzeTrade();

}, 15000);

</script>

</body>

</html>
